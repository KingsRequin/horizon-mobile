# Vérification à chaque poussée (tests, lint en erreurs, les deux APK, un seul APK pour tous
# les processeurs) ; sur une étiquette v*, l'APK signé part dans une Release avec sa somme SHA-256.
# Actions épinglées par empreinte.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # La clé de signature n'existe que pour une étiquette, et seulement si le dépôt a ses
      # secrets ; sans elle l'APK sort non signé et la publication s'arrête plus bas.
      - name: Clé de signature
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HM_KEYSTORE_BASE64: ${{ secrets.HM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HM_KEYSTORE_BASE64" ]; then
            printf '%s' "$HM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Tests, lint, APK, un seul APK pour tous les processeurs
        shell: pwsh
        env:
          HM_KEYSTORE_PASSWORD: ${{ secrets.HM_KEYSTORE_PASSWORD }}
          HM_KEY_ALIAS: ${{ secrets.HM_KEY_ALIAS }}
          HM_KEY_PASSWORD: ${{ secrets.HM_KEY_PASSWORD }}
        run: ./tools/verifier.ps1

      - name: APK de la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep '^versionName=' version.properties | cut -d= -f2)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::l'étiquette $TAG ne correspond pas à version.properties ($version)"; exit 1
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::APK non signé : les secrets de signature manquent, rien n'est publié"; exit 1
          fi
          mkdir -p sortie
          cp "$apk" "sortie/horizon-mobile-$version.apk"
          (cd sortie && sha256sum "horizon-mobile-$version.apk" > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk
          path: sortie/
          if-no-files-found: error

  publier:
    needs: verifier
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: sortie
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" sortie/* --title "Horizon Mobile ${TAG#v}" --generate-notes
